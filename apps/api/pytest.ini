[pytest]
# Só testes unitários puros (sem Postgres). Os smoke_*.py continuam sendo o
# teste de integração end-to-end contra banco real; estes cobrem as regras de
# borda que smoke não alcança de forma barata (SEC/qualidade, auditoria 07-12).
testpaths = tests
python_files = test_*.py
# no:cacheprovider evita o warning de permissão de cache (Windows/CI efêmero).
addopts = -q -p no:cacheprovider

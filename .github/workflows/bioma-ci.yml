name: Bioma CI

on:
  push:
    branches: [develop, main]
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/**"
      - "scripts/**"
      - ".github/workflows/bioma-ci.yml"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/**"
      - "scripts/**"
      - ".github/workflows/bioma-ci.yml"

concurrency:
  group: bioma-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-unit:
    # Testes puros (sem Postgres): rápidos, rodam antes/à parte dos smokes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r apps/api/requirements-dev.txt
      - run: python -m pytest
        working-directory: apps/api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # CONTRACT-001: os tipos gerados precisam bater com o openapi.json
      # versionado. Se o commit mexeu no contrato mas esqueceu de rodar
      # `npm run types:api`, o diff aqui acusa antes do build.
      - run: npm run types:api
      - name: Verificar tipos do OpenAPI em dia
        run: git diff --exit-code src/types/api-schema.d.ts
      - run: npm run build

  api-worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bioma
          POSTGRES_USER: bioma
          POSTGRES_PASSWORD: bioma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bioma -d bioma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: local
      DATABASE_URL: postgresql://bioma:bioma@localhost:5432/bioma
      CORS_ORIGINS: http://localhost:5173
      # Banco isolado para os smokes mutáveis (guarda de sufixo _smoke).
      BIOMA_SMOKE_DATABASE_URL: postgresql://bioma:bioma@localhost:5432/bioma_smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/worker/requirements.txt
      - run: pip install -r apps/api/requirements.txt -r apps/worker/requirements.txt
      - run: python -m compileall apps/api/bioma_api apps/api/scripts apps/worker/bioma_worker apps/worker/scripts
      - run: python apps/api/scripts/migrate.py
      # CONTRACT-001: o openapi.json versionado precisa refletir a API atual.
      - run: python apps/api/scripts/export_openapi.py --check
      - run: python apps/api/scripts/seed_dev.py
      # SMOKE-DISCOVERY: a CI listava 4 smokes na mao enquanto o repositorio tinha
      # 40+. Todo smoke novo nascia fora da CI — foi assim que um 500 em toda a
      # ingestao de transcricao do copiloto de vendas passou meses invisivel.
      # O runner descobre os smokes automaticamente; exclusoes ficam declaradas
      # com motivo em scripts/run_smokes.py.
      - run: python scripts/run_smokes.py --group standard
      # Os smokes mutáveis (queue/vault/reaper) exigem banco isolado com sufixo
      # _smoke. A CI nunca o provisionava, então esses passos falhavam. Cria,
      # migra e semeia o banco dedicado antes de rodá-los.
      - name: Provisionar banco de smoke isolado
        run: >-
          python -c "import psycopg;
          c = psycopg.connect('postgresql://bioma:bioma@localhost:5432/postgres', autocommit=True);
          c.execute('drop database if exists bioma_smoke');
          c.execute('create database bioma_smoke');
          c.close()"
      - name: Migrar e semear banco de smoke
        env:
          DATABASE_URL: postgresql://bioma:bioma@localhost:5432/bioma_smoke
        run: |
          python apps/api/scripts/migrate.py
          python apps/api/scripts/seed_dev.py
      - name: Smokes que exigem banco isolado
        env:
          DATABASE_URL: postgresql://bioma:bioma@localhost:5432/bioma_smoke
        run: python scripts/run_smokes.py --group mutable

